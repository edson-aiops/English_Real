<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D9E75" />
    <link rel="manifest" href="/English_Real/manifest.json" />
    <title>Word Drill IELTS</title>
    <script type="module" crossorigin src="/English_Real/assets/index-BAkIX4LF.js"></script>
    <link rel="stylesheet" crossorigin href="/English_Real/assets/index-TQzvN23K.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      let deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        window.deferredInstallPrompt = e;
        const btn = document.getElementById('install-btn');
        if (btn) btn.hidden = false;
      });
      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        window.deferredInstallPrompt = null;
        const btn = document.getElementById('install-btn');
        if (btn) btn.hidden = true;
      });

      /* Service Worker + Update detection */
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/English_Real/sw.js').then((reg) => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                const updateBar = document.getElementById('update-bar');
                if (updateBar) updateBar.style.display = 'flex';
              }
            });
          });
        });
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!reloading) { reloading = true; window.location.reload(); }
        });
      }
    </script>
  </body>
</html>
